# kurogiの技術ブログ — Minimal Mistakes（Jekyll remote theme）for GitHub Pages
# GitHub Pagesがmainブランチから自動でサイトを作ります。
# ローカルで確認する場合（任意）はRuby + Bundlerが必要です：bundle install、bundle exec jekyll serve

title: kurogiの技術ブログ
description: >-
  東京在住のITエンジニアです
url: https://kyotodaisuki.github.io
baseurl: ""
github_username: kyotodaisuki
minimal_mistakes_skin: default
search: true

markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: Asia/Tokyo

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name: "kurogi"
  bio: "Java開発者。"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/kyotodaisuki"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/kyotodaisuki"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
      toc: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
