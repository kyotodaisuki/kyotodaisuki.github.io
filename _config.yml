# sennta Tech Blog — Minimal Mistakes (Jekyll remote theme) for GitHub Pages
# GitHub Pages builds this site automatically from the main branch.
# Local preview (optional) needs Ruby + Bundler: bundle install, then bundle exec jekyll serve

title: sennta Tech Blog
description: >-
  Java 保守、Linux、Python、ROS2 学习记录，目标是自动驾驶软件结合验证工程师。
url: https://kyotodaisuki.github.io
baseurl: ""
github_username: kyotodaisuki
minimal_mistakes_skin: default
search: true

markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: Asia/Tokyo

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name: "sennta"
  bio: "在东京做 Java 维护，自学转行 IT，正在学习 Linux、Python 和 ROS2，目标是自动驾驶软件结合验证。"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/kyotodaisuki"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/kyotodaisuki"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
      toc: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
